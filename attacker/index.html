<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RED TEAM // BLACKBOX</title>
<style>
:root{
  --void:#050607; --panel:#0A0E0C; --phosphor:#39FF88; --phos-dim:#1E8A4C;
  --blood:#FF2D3D; --amber:#FFB020; --dim:#24302A; --text:#B8D9C4;
  --mono: "JetBrains Mono","IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--text);font-family:var(--mono);overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr;font-size:15px;letter-spacing:.02em}

/* CRT overlay */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.flicker{animation:flick 6s infinite steps(1)}
@keyframes flick{0%,97%,100%{opacity:1}97.5%{opacity:.86}98%{opacity:1}98.6%{opacity:.9}}

/* header */
header{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid var(--dim);background:var(--panel)}
.brand{color:var(--blood);font-weight:700;letter-spacing:.3em;font-size:14px;text-shadow:0 0 8px rgba(255,45,61,.5)}
.target{color:var(--phos-dim);font-size:13px}
.target b{color:var(--phosphor);font-weight:500}
.link{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--phosphor)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 10px var(--phosphor);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.clock{color:var(--phos-dim);font-size:13px}

/* main grid */
main{display:grid;grid-template-columns:minmax(380px,34%) 1fr;min-height:0}
.left{border-right:1px solid var(--dim);display:flex;flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.label{font-size:11px;letter-spacing:.28em;color:var(--phos-dim);padding:22px 28px 12px;text-transform:uppercase}

/* vectors */
.vectors{display:flex;flex-direction:column;gap:10px;padding:0 28px}
.vec{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;
  padding:16px 18px;border:1px solid var(--dim);background:linear-gradient(90deg,rgba(57,255,136,.03),transparent);
  transition:border-color .15s,background .15s,transform .15s;position:relative;overflow:hidden}
.vec:hover:not([disabled]){border-color:var(--phosphor);background:rgba(57,255,136,.06);transform:translateX(4px)}
.vec:hover:not([disabled]) .num{color:var(--void);background:var(--phosphor);box-shadow:0 0 14px var(--phosphor)}
.vec[disabled]{cursor:not-allowed;opacity:.45}
.vec.running{border-color:var(--amber);opacity:1}
.vec.running::after{content:"";position:absolute;left:0;bottom:0;height:2px;background:var(--amber);animation:sweep 1.1s linear infinite}
@keyframes sweep{from{width:0}to{width:100%}}
.num{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--phosphor);color:var(--phosphor);font-weight:700;font-size:18px;transition:.15s}
.vt{font-size:15px;color:#E6FFF0;font-weight:600;letter-spacing:.04em}
.vs{font-size:12px;color:var(--phos-dim);margin-top:4px}
.state{font-size:11px;letter-spacing:.18em;color:var(--phos-dim)}

.controls{display:flex;gap:10px;padding:16px 28px}
.ctl{all:unset;cursor:pointer;flex:1;text-align:center;padding:12px;border:1px solid var(--blood);color:var(--blood);
  font-size:13px;letter-spacing:.26em;font-weight:700;transition:.15s}
.ctl:hover{background:var(--blood);color:var(--void);box-shadow:0 0 18px rgba(255,45,61,.5)}
.ctl.ghost{border-color:var(--dim);color:var(--phos-dim)}
.ctl.ghost:hover{background:var(--dim);color:var(--text);box-shadow:none}

/* objectives */
.objectives{padding:0 28px 22px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.obj{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 14px;border:1px solid var(--dim);position:relative}
.on{font-size:14px;color:#E6FFF0}
.od{font-size:11px;color:var(--phos-dim);margin-top:3px}
.ov{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--phos-dim)}
.obj.blocked{border-color:rgba(255,45,61,.55);background:rgba(255,45,61,.05)}
.obj.blocked .on{color:#ff9aa2;text-decoration:line-through;text-decoration-color:var(--blood)}
.obj.blocked .ov{color:var(--blood);text-shadow:0 0 10px rgba(255,45,61,.6)}
.obj.breached{border-color:var(--phosphor);background:rgba(57,255,136,.06)}
.obj.breached .ov{color:var(--phosphor)}
.obj.fault .ov{color:var(--amber)}
.score{padding:0 28px 22px;font-size:13px;color:var(--phos-dim);letter-spacing:.14em}
.score b{color:var(--blood);font-size:22px;letter-spacing:0}

/* terminal */
.right{display:flex;flex-direction:column;min-height:0;position:relative}
.term{flex:1;overflow-y:auto;padding:22px 32px 40px;font-size:15px;line-height:1.65;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.ln{white-space:pre-wrap;word-break:break-word;color:var(--text)}
.ln.cmd{color:var(--phosphor)}
.ln.sys{color:var(--phos-dim)}
.ln.pass{color:var(--blood);font-weight:700}
.ln.vuln{color:var(--phosphor);font-weight:700}
.ln.err{color:var(--amber)}
.ln.head{color:#E6FFF0;font-weight:700;margin-top:14px;letter-spacing:.06em}
.caret{display:inline-block;width:10px;height:1.1em;background:var(--phosphor);vertical-align:text-bottom;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* stamp */
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20}
.stamp span{font-size:clamp(64px,10vw,150px);font-weight:800;letter-spacing:.12em;color:var(--blood);
  border:6px solid var(--blood);padding:6px 34px;transform:rotate(-8deg);opacity:0;
  text-shadow:4px 0 rgba(0,200,255,.55),-4px 0 rgba(255,0,80,.6),0 0 30px rgba(255,45,61,.6)}
.flash{position:fixed;inset:0;background:var(--blood);pointer-events:none;opacity:0;z-index:40}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body class="flicker">
<header>
  <div class="brand">▲ RED TEAM</div>
  <div class="target">TARGET <b>BLACKBOX</b> · local demo instance</div>
  <div class="link"><span class="dot"></span><span id="linkTxt">ARMED</span></div>
  <div class="clock" id="clock"></div>
</header>

<main>
  <section class="left">
    <div class="label">Attack vectors</div>
    <div class="vectors" id="vectors"></div>
    <div class="controls">
      <button class="ctl" id="runAll">RUN ALL</button>
      <button class="ctl ghost" id="reset">RESET</button>
    </div>
    <div class="label">Objectives</div>
    <div class="objectives" id="objectives"></div>
    <div class="score" id="score">OBJECTIVES BLOCKED <b>0</b> / 4</div>
  </section>

  <section class="right">
    <div class="label">Live output</div>
    <div class="term" id="term"></div>
    <div class="stamp"><span id="stamp">DENIED</span></div>
  </section>
</main>
<div class="flash" id="flash"></div>

<script>
const VECTORS = [
  { n:1, title:'SESSION REPLAY',   sub:'reuse a responder token after it expires', obj:'Responder credentials', od:'act as a real team member' },
  { n:2, title:'RECORD TAMPER',    sub:'rewrite the audit log as database owner',  obj:'Audit log integrity',    od:'quietly rewrite incident history' },
  { n:3, title:'PROMPT INJECTION', sub:'hide instructions inside uploaded evidence', obj:'Agent control',        od:'make the AI follow attacker orders' },
  { n:4, title:'NETWORK CUT',      sub:'take one responder device offline',         obj:'Availability',           od:'blind the response team' },
];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const term = $('term');
let running = false;

// build UI
for (const v of VECTORS) {
  const b = document.createElement('button');
  b.className = 'vec'; b.id = 'v' + v.n;
  b.innerHTML = `<div class="num">${v.n}</div><div><div class="vt">${v.title}</div><div class="vs">${v.sub}</div></div><div class="state" id="s${v.n}">READY</div>`;
  b.onclick = () => run(v.n);
  $('vectors').append(b);
  const o = document.createElement('div');
  o.className = 'obj'; o.id = 'o' + v.n;
  o.innerHTML = `<div><div class="on">${v.obj}</div><div class="od">${v.od}</div></div><div class="ov" id="ov${v.n}">○ UNKNOWN</div>`;
  $('objectives').append(o);
}

setInterval(() => $('clock').textContent = new Date().toISOString().slice(11,19) + 'Z', 1000);

function line(text, cls = '') {
  const d = document.createElement('div');
  d.className = 'ln ' + cls; d.textContent = text;
  term.append(d); term.scrollTop = term.scrollHeight;
  if (!reduce) d.animate([{opacity:0, transform:'translateX(-6px)'},{opacity:1, transform:'none'}], {duration:160, easing:'ease-out'});
  return d;
}
async function typeLine(text, cls) {
  const d = line('', cls);
  if (reduce) { d.textContent = text; return; }
  for (let i = 0; i <= text.length; i += 2) { d.textContent = text.slice(0, i); await new Promise(r => setTimeout(r, 12)); }
  d.textContent = text;
}
function classify(t) {
  if (/^\s*PASS\b/.test(t)) return 'pass';
  if (/^\s*VULN\b/.test(t)) return 'vuln';
  if (/^\s*(ERROR|SKIP)\b|REFUSING/.test(t)) return 'err';
  if (/^>/.test(t)) return 'head';
  return 'sys';
}
function pretty(t) {
  return t.replace(/^\s*PASS\s+/, '  ✕ BLOCKED  ').replace(/^\s*VULN\s+/, '  ✓ BREACHED ');
}

function stamp(text, color) {
  if (reduce) return;
  const s = $('stamp'); s.textContent = text; s.style.color = color; s.style.borderColor = color;
  s.animate([
    {opacity:0, transform:'rotate(-8deg) scale(2.2)', filter:'blur(6px)'},
    {opacity:1, transform:'rotate(-8deg) scale(.94)', filter:'blur(0)', offset:.35},
    {opacity:1, transform:'rotate(-8deg) scale(1)', offset:.75},
    {opacity:0, transform:'rotate(-8deg) scale(1)'}
  ], {duration:1300, easing:'cubic-bezier(.2,.9,.3,1.2)'});
  $('flash').animate([{opacity:.22},{opacity:0}], {duration:380});
  document.body.animate([
    {transform:'translate(0,0)'},{transform:'translate(-7px,2px)'},{transform:'translate(6px,-2px)'},
    {transform:'translate(-4px,1px)'},{transform:'translate(0,0)'}
  ], {duration:300});
}

function resolve(n, results) {
  const o = $('o' + n), ov = $('ov' + n), st = $('s' + n);
  o.classList.remove('blocked','breached','fault');
  const vuln = results.some(r => r.outcome === 'VULN');
  const err  = results.some(r => r.outcome === 'ERROR');
  const pass = results.filter(r => r.outcome === 'PASS').length;
  if (vuln)       { o.classList.add('breached'); ov.textContent = '✓ BREACHED'; st.textContent = 'SUCCEEDED'; stamp('BREACHED', 'var(--phosphor)'); }
  else if (err || !pass) { o.classList.add('fault'); ov.textContent = '! FAULT';  st.textContent = 'FAULT'; }
  else            { o.classList.add('blocked'); ov.textContent = '✕ BLOCKED'; st.textContent = 'DENIED'; stamp('DENIED', 'var(--blood)'); }
  if (!reduce) o.animate([{transform:'scale(1.04)'},{transform:'scale(1)'}], {duration:260});
  $('score').innerHTML = `OBJECTIVES BLOCKED <b>${document.querySelectorAll('.obj.blocked').length}</b> / 4`;
}

function run(n) {
  if (running) return Promise.resolve();
  running = true;
  document.querySelectorAll('.vec').forEach(b => b.disabled = true);
  const btn = $('v' + n); btn.disabled = false; btn.classList.add('running');
  $('s' + n).textContent = 'RUNNING'; $('linkTxt').textContent = 'ENGAGED';
  const v = VECTORS[n-1];
  return new Promise(async done => {
    await typeLine(`$ ./attack --vector ${n} --target blackbox    # ${v.title}`, 'cmd');
    let results = [];
    const es = new EventSource('/run/' + n);
    es.addEventListener('line', e => { const t = JSON.parse(e.data); line(pretty(t), classify(t)); });
    es.addEventListener('result', e => { results = JSON.parse(e.data); });
    es.addEventListener('done', () => { es.close(); finish(); });
    es.onerror = () => { es.close(); line('  connection to local bridge lost', 'err'); finish(); };
    function finish() {
      btn.classList.remove('running');
      resolve(n, results);
      document.querySelectorAll('.vec').forEach(b => b.disabled = false);
      $('linkTxt').textContent = 'ARMED';
      running = false; done();
    }
  });
}

$('runAll').onclick = async () => {
  if (running) return;
  for (const v of VECTORS) { await run(v.n); await new Promise(r => setTimeout(r, 1200)); }
  const blocked = document.querySelectorAll('.obj.blocked').length;
  await typeLine(`\n== ${blocked}/4 objectives blocked ==`, blocked === 4 ? 'pass' : 'vuln');
};
$('reset').onclick = () => {
  if (running) return;
  term.innerHTML = '';
  for (const v of VECTORS) {
    $('o' + v.n).className = 'obj'; $('ov' + v.n).textContent = '○ UNKNOWN'; $('s' + v.n).textContent = 'READY';
  }
  $('score').innerHTML = 'OBJECTIVES BLOCKED <b>0</b> / 4';
  boot();
};

async function boot() {
  for (const t of ['initializing red-team console…', 'loading vectors from attack/demo/ … 4 found', 'target locked: BLACKBOX (local demo instance)', 'ready.'])
    await typeLine(t, 'sys');
  const c = document.createElement('span'); c.className = 'caret'; term.lastChild.append(c);
}
boot();
</script>
</body>
</html>
